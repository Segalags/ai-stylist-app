<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Celebrity Beauty & Dupes</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg: #f5f5f7;
            --text: #1d1d1f;
            --hint: #86868b;
            --card: #ffffff;
            --glass: rgba(255, 255, 255, 0.85);
            --seg: rgba(118, 118, 128, 0.1);
            --seg-act: #ffffff;
            --accent: #ff2d55;
            --accent-txt: #ffffff;
            --border: rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 62px 16px 96px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .topbar {
            position: fixed; top: 0; left: 0; right: 0;
            background: var(--glass);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid var(--border);
            padding: 10px 16px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
        }

        .brand-tag { font-size: 13px; font-weight: 700; letter-spacing: -0.2px; }

        .coin-badge {
            background: rgba(255, 159, 10, 0.15);
            color: #d97706;
            font-size: 11px;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 12px;
        }

        .header { margin: 4px 0 16px 2px; }
        .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin: 0; }
        .header p { font-size: 13px; color: var(--hint); margin: 4px 0 0 0; }

        /* Горизонтальний вибір відомих людей */
        .celeb-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 10px;
            scrollbar-width: none;
        }
        .celeb-scroll::-webkit-scrollbar { display: none; }

        .celeb-chip {
            flex: 0 0 auto;
            background: var(--card);
            border: 1.5px solid transparent;
            border-radius: 18px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.03);
            transition: 0.2s;
        }

        .celeb-chip.active {
            border-color: var(--accent);
        }

        .celeb-avatar {
            width: 42px; height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--seg);
        }

        .celeb-name { font-size: 13px; font-weight: 700; }
        .celeb-effect { font-size: 11px; color: var(--hint); }

        /* Картка косметичного засобу */
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 14px;
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 0.5px solid var(--border);
        }

        .item-row { display: flex; gap: 14px; align-items: center; }
        .item-img { width: 70px; height: 84px; border-radius: 12px; object-fit: cover; background: var(--seg); }
        .item-body { flex: 1; }
        .item-step { font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
        .item-brand { font-size: 15px; font-weight: 700; margin: 2px 0; }
        .item-desc { font-size: 12px; color: var(--hint); line-height: 1.35; }
        .item-price { font-size: 16px; font-weight: 700; margin-top: 6px; }

        .seg-control { display: flex; background: var(--seg); border-radius: 11px; padding: 3px; }
        .seg-btn {
            flex: 1; border: none; background: transparent; color: var(--text);
            padding: 7px 4px; font-size: 11px; font-weight: 600;
            border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .seg-btn.active { background: var(--seg-act); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }

        .ai-note {
            background: var(--bg);
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.4;
            color: var(--text);
        }

        .total-bar {
            background: var(--card); padding: 16px 18px; border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .total-bar span:first-child { font-size: 13px; color: var(--hint); }
        .total-bar span:last-child { font-size: 20px; font-weight: 700; }
    </style>
</head>
